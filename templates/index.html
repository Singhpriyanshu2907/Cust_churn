<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width , initial=scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static' , filename='style.css') }}">
    <title>CUSTOMER APPOINTMENT PREDICTION ❤️</title>
</head>


<body>
<div class="container">
    <h2>Customer Appointment Prediction</h2>

    <form method="POST">
        <div class="form-group">
            <label for="Support_calls">Support_calls</label>
            <input type="number" id="Support_calls" name="Support_calls" required>
        </div>


        <div class="form-group">
            <label for="no_of_special_request">no_of_special_request</label>
            <input type="number" id="no_of_special_request" name="no_of_special_request" required>
        </div>

        <div class="form-group">
            <label for="Total_spend">Total_spend</label>
            <input type="number" id="Total_spend" name="Total_spend" required>
        </div>

        <div class="form-group">
            <label for="arrival_month">Arrival Month</label>
            <select id="arrival_month" name="arrival_month" required>
                <option value="1">Januray</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
        </div>


        <div class="form-group">
            <label for="arrival_date">Arrival Date</label>
            <select id="arrival_date" name="arrival_date" required>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
                <option value="21">21</option>
                <option value="22">22</option>
                <option value="23">23</option>
                <option value="24">24</option>
                <option value="25">25</option>
                <option value="26">26</option>
                <option value="27">27</option>
                <option value="28">28</option>
                <option value="29">29</option>
                <option value="30">30</option>
                <option value="31">31</option>
            </select>
        </div>

        <div class="form-group">
            <label for="market_segment_type">Market_segment_type</label>
            <select id="market_segment_type" name="market_segment_type" required>
                <option value="1">Complimentary</option>
                <option value="2">Corporate</option>
                <option value="3">Offline</option>
                <option value="4">Online</option>
            </select>
        </div>

        <div class="form-group">
            <label for="age">age</label>
            <input type="number" id="age" name="age" required>
        </div>

        <div class="form-group">
            <label for="Usage_frequency">Usage_frequency</label>
            <input type="number" id="Usage_frequency" name="Usage_frequency" required>
        </div>

        <div class="form-group">
            <label for="type_plan">type_plan</label>
            <select id="type_plan" name="type_plan" required>
                <option value="0">Basic</option>
                <option value="1">Premium</option>
                <option value="2">Standard</option>
            </select>
        </div>

        <div class="form-group">
            <label for="arrival_year">arrival_year</label>
            <select id="arrival_year" name="arrival_year" required>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
                <option value="2020">2020</option>
                <option value="2019">2019</option>
            </select>
        </div>

        <button type="submit">Predict</button>
    </form>

    {% if prediction is not none %}
    <div class="result">
        {% if prediction == 0 %}
        <p>The Patient is going to cancel Appointment</p>
        {% elif prediction == 1 %}
        <p>The patient is not going to cancel Appointment</p>
        {% endif %}
    </div>
    {% endif %}
</div>

</body>
</html>
